<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Torre Inversiones</title>
    <meta name="description" content="Escríbenos por WhatsApp, teléfono o correo, o agenda una asesoría sin costo. Te responde una persona de nuestro equipo en menos de 24 horas hábiles.">
    <meta property="og:title" content="Hablemos de tu siguiente inversión | Torre Inversiones">
    <meta property="og:image" content="Logo Torre Inversiones - Sin Fondo.png">
    <link rel="icon" type="image/png" href="Logo Torre Inversiones - Sin Fondo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="index.css?v=6.9">
</head>
<body class="theme-light" data-page="contacto" data-wa-msg="Hola, me gustaría recibir asesoría de Torre Inversiones.">

    <div id="site-header"></div>

    <main>
        <section class="internal-hero hero-photo">
            <div class="container hero-split">
            <div class="hero-split-text">
                <h1 class="internal-hero-title">Hablemos de tu <span class="text-gradient-gold">siguiente inversión.</span></h1>
                <p class="internal-hero-subtitle">
                    Escríbenos por el medio que prefieras. Te responde una persona de nuestro equipo, en menos de 24 horas hábiles.
                </p>
            </div>
            <figure class="media-split-photo hero-figure" data-img-tag="contactoHero" data-sizes="(min-width: 900px) 45vw, 100vw" data-alt="Equipo de Torre Inversiones"></figure>
            </div>
        </section>

        <section class="section-padding">
            <div class="container">
                <div class="contact-grid">
                    <div class="contact-info reveal">
                        <span class="eyebrow">Canales</span>
                        <h2 class="title-medium">Contacto directo</h2>
                        <div class="contact-channels" id="contactChannels"></div>
                    </div>

                    <div class="contact-form-wrapper reveal reveal-delay-1">
                        <form class="contact-form" id="contactForm" data-ghl-form data-tags="formulario-contacto">
                            <div class="form-group">
                                <label for="cName">Nombre *</label>
                                <input type="text" id="cName" name="nombre" class="form-control" autocomplete="name" required>
                            </div>
                            <div class="form-row-2">
                                <div class="form-group">
                                    <label for="cPhone">WhatsApp *</label>
                                    <input type="tel" id="cPhone" name="telefono" class="form-control" autocomplete="tel" inputmode="tel" required>
                                </div>
                                <div class="form-group">
                                    <label for="cEmail">Correo *</label>
                                    <input type="email" id="cEmail" name="correo" class="form-control" autocomplete="email" required>
                                </div>
                            </div>
                            <div class="form-row-2">
                                <div class="form-group">
                                    <label for="cPerfil">Soy *</label>
                                    <select id="cPerfil" name="perfil" class="form-control form-select" required>
                                        <option value="">Selecciona</option>
                                        <option value="inversionista">Inversionista</option>
                                        <option value="broker">Broker / asesor</option>
                                        <option value="desarrollador">Desarrollador</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="cInteres">Interés</label>
                                    <select id="cInteres" name="interes" class="form-control form-select">
                                        <option value="no-se-aun">No sé aún</option>
                                        <option value="inmobiliario">Inmobiliario</option>
                                        <option value="agroinversion">Agroinversión</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-row-2">
                                <div class="form-group">
                                    <label for="cRango">Rango de inversión</label>
                                    <select id="cRango" name="rango_inversion" class="form-control form-select">
                                        <option value="">Prefiero no decir</option>
                                        <option value="hasta-500k">Hasta $500 mil</option>
                                        <option value="500k-1m">$500 mil – $1 millón</option>
                                        <option value="1m-3m">$1 – $3 millones</option>
                                        <option value="mas-3m">Más de $3 millones</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="cFuente">¿Cómo nos conociste?</label>
                                    <select id="cFuente" name="como_nos_conociste" class="form-control form-select">
                                        <option value="">Selecciona</option>
                                        <option value="facebook-instagram">Facebook / Instagram</option>
                                        <option value="evento">Evento o webinar</option>
                                        <option value="recomendacion">Recomendación</option>
                                        <option value="google">Google</option>
                                        <option value="otro">Otro</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="cMsg">Mensaje</label>
                                <textarea id="cMsg" name="mensaje" class="form-control" placeholder="Cuéntanos qué buscas"></textarea>
                            </div>
                            <label class="checkbox-row">
                                <input type="checkbox" name="acepta_privacidad" value="si" required>
                                <span>He leído y acepto el <a href="aviso-privacidad.html" target="_blank">aviso de privacidad</a>. *</span>
                            </label>
                            <button type="submit" class="btn btn-primary btn-block submit-btn">Enviar <i class="far fa-paper-plane"></i></button>
                            <div class="form-feedback" id="formFeedback" role="status"></div>
                        </form>
                    </div>
                </div>
            </div>
        </section>

        <section class="section-padding section-alt" id="agenda">
            <div class="container narrow">
                <div class="section-header reveal">
                    <span class="eyebrow">Agenda</span>
                    <h2 class="title-medium">Agenda tu asesoría</h2>
                    <p>Por videollamada o presencial. La asesoría no tiene costo para ti.</p>
                </div>
                <div id="agendaEmbed" class="agenda-embed"></div>
            </div>
        </section>
    </main>

    <div id="site-footer"></div>

    <script src="config.js?v=4.5"></script>
    <script src="desarrollos-data.js?v=2.0"></script>
    <script src="layout.js?v=2.8"></script>
    <script src="index.js?v=4.2"></script>
</body>
</html>
